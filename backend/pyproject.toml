[project]
name = "mantle-backend"
version = "0.1.0"
description = "Mantle digital-twin backend workspace (SIH26120)"
requires-python = ">=3.12"
dependencies = [
  "mantle-physics",
  "mantle-data",
  "mantle-ml[train]",
  "mantle-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mantle-physics = { workspace = true }
mantle-data = { workspace = true }
mantle-ml = { workspace = true }
mantle-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-ra --import-mode=importlib"
markers = ["network: hits the real network (skipped unless --run-network)", "slow: long-running (skipped unless --runslow)"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501", "N802", "N803", "N806", "N815", "N816", "E741", "B905", "SIM108", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "E501"]
"**/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
exclude = ["/tests/"]
ignore_missing_imports = true
files = ["packages/mantle-physics/src", "packages/mantle-data/src", "packages/mantle-ml/src", "packages/mantle-api/src"]
