[project]
name = "mantle-physics"
version = "0.1.0"
description = "Mantle physics core: reservoir, rods, pump, economics, wave-equation dynamometer cards, hazards"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantle_physics"]
