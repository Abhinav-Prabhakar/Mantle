[project]
name = "mantle-api"
version = "0.1.0"
description = "Mantle API: FastAPI service over the physics twin, the DuckDB records and the ML/optimiser models"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.1",
    "mantle-data",
    "mantle-ml",
    "mantle-physics",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mantle-api = "mantle_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantle_api"]

[tool.uv.sources]
mantle-physics = { workspace = true }
mantle-data = { workspace = true }
mantle-ml = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
