[project]
name = "mantle-data"
version = "0.1.0"
description = "Mantle data package (placeholder until its build stage)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.22.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantle_data"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
