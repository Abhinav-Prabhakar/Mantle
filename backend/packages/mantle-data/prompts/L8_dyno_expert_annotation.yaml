id: L8
name: dyno_expert_annotation
suggested_n: 12000
records_per_call: 1
est_output_tokens: 280
sampled_from:
- S4
variables:
- card_features
- label
user_template: 'You are a rod-lift diagnostics expert. Given this dynamometer card summary {card_features} (and
  the true class {label} for reference), write the annotation an expert would attach: the visual cues on the card,
  the diagnosis, confidence, and the corrective action.'
fields:
- name: card_class
  type: str
- name: visual_cues
  type: list[str]
  min_items: 1
- name: diagnosis
  type: str
- name: confidence
  type: float
  min: 0
  max: 1
- name: corrective_action
  type: str
