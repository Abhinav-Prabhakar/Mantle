id: L1
name: well_master
suggested_n: 400
records_per_call: 1
est_output_tokens: 650
sampled_from:
- S1
variables:
- well_id
- spud_date
- pump_depth
- perf_top
- perf_bot
- physics_facts
user_template: 'Write the well master record for {well_id} drilled {spud_date}: completion summary, casing/tubing/rod
  taper design (grades, sizes, lengths), pump (type, bore, setting depth {pump_depth} m), pumping unit model class
  and stroke settings, VFD rating, perforation interval {perf_top}-{perf_bot} m, last 3 workovers with reasons.
  Keep numbers consistent with: {physics_facts}.'
fields:
- name: well_id
  type: str
- name: spud_date
  type: str
- name: completion_summary
  type: str
- name: casing_design
  type: str
- name: tubing_design
  type: str
- name: rod_taper_sections
  type: list[str]
  min_items: 2
- name: pump_type
  type: str
- name: pump_bore_in
  type: float
  min: 0.75
  max: 2.5
- name: pump_setting_depth_m
  type: float
  min: 500
  max: 1300
- name: pumping_unit_model
  type: str
- name: stroke_settings
  type: str
- name: vfd_rating_kw
  type: float
  min: 5
  max: 75
- name: perforation_top_m
  type: float
  min: 1000
  max: 1200
- name: perforation_bottom_m
  type: float
  min: 1000
  max: 1250
- name: last_workovers
  type: list[str]
  min_items: 3
  max_items: 3
checks:
  ordered_ascending:
  - - perforation_top_m
    - perforation_bottom_m
