id: L10
name: steam_generator_log
suggested_n: 10000
records_per_call: 1
est_output_tokens: 330
sampled_from:
- S2
variables:
- unit
- date
- plan
user_template: 'Write a daily steam-generator log for OTSG {unit} on {date}: steam quality, rate t/h, feedwater
  TDS/hardness, burner hours, fuel gas Sm3, trips and causes, consistent with injection plan {plan}.'
fields:
- name: unit
  type: str
- name: date
  type: str
- name: steam_quality
  type: float
  min: 0.3
  max: 1.0
- name: steam_rate_t_per_h
  type: float
  min: 0
  max: 40
- name: feedwater_tds_ppm
  type: float
  min: 0
- name: feedwater_hardness_ppm
  type: float
  min: 0
- name: burner_hours
  type: float
  min: 0
  max: 24
- name: fuel_gas_sm3
  type: float
  min: 0
- name: trips
  type: list[str]
- name: remarks
  type: str
