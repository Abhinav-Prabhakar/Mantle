id: L2
name: css_cycle_design
suggested_n: 4000
records_per_call: 1
est_output_tokens: 520
sampled_from:
- S1
- S2
variables:
- well_id
- n
- prev_cycle_summary
- actuals
user_template: 'Write the CSS cycle design sheet for {well_id} cycle {n} as planned by the reservoir team: steam
  volume, injection pressure/rate/quality, soak days, expected cut-off, rationale (2-4 sentences referring to previous
  cycle {prev_cycle_summary}), approval chain, and a post-cycle review note comparing plan vs actual {actuals}.'
fields:
- name: well_id
  type: str
- name: cycle_no
  type: int
  min: 1
- name: steam_volume_t
  type: float
  min: 200
  max: 1600
- name: injection_pressure_mpa
  type: float
  min: 3
  max: 15
- name: injection_rate_t_per_d
  type: float
  min: 15
  max: 120
- name: steam_quality
  type: float
  min: 0.3
  max: 1.0
- name: soak_days
  type: float
  min: 1
  max: 20
- name: expected_cutoff_day
  type: int
  min: 30
  max: 140
- name: rationale
  type: str
- name: approval_chain
  type: list[str]
  min_items: 2
- name: post_cycle_review
  type: str
