id: L11
name: energy_tariff_note
suggested_n: 50
records_per_call: 1
est_output_tokens: 300
sampled_from: []
variables:
- period
user_template: Write a short note on the electricity tariff and fuel-gas price applicable to {period} for a Rajasthan
  upstream site, as would appear in an internal cost memo (INR/kWh slabs, demand charge, gas INR/Sm3).
fields:
- name: period
  type: str
- name: energy_slabs
  type: list[str]
  min_items: 1
- name: demand_charge_inr_per_kva_month
  type: float
  min: 0
- name: fuel_gas_inr_per_sm3
  type: float
  min: 0
- name: note
  type: str
