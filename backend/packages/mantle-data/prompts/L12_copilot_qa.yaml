id: L12
name: copilot_qa
suggested_n: 5000
records_per_call: 1
est_output_tokens: 300
sampled_from:
- S1
- S2
- S5
variables:
- topic
- well_id
- facts
user_template: 'Write a question an OIL production engineer might ask about {topic} for {well_id} and the ideal
  grounded answer using only {facts} (cite the numbers). Topics: rod float, fluid pound, SOR, cut-off timing, soak
  length, VFD profile, asphaltene deposition, pump unseating.'
fields:
- name: topic
  type: str
- name: well_id
  type: str
- name: question
  type: str
- name: answer
  type: str
- name: cited_facts
  type: list[str]
  min_items: 1
