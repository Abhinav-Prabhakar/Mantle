id: L5
name: workover_ticket
suggested_n: 8000
records_per_call: 1
est_output_tokens: 420
sampled_from:
- S1
- S5
variables:
- well_id
- type
user_template: 'Write a workover/maintenance ticket for {well_id}: request, job steps, rig hours, materials, cost
  INR, outcome; job type {type} from {{rod job, pump change, tubing leak repair, stuffing box repack, VFD fault,
  belt/sheave change, gearbox oil change, counterbalance adjustment}}.'
fields:
- name: well_id
  type: str
- name: job_type
  type: str
  enum:
  - rod job
  - pump change
  - tubing leak repair
  - stuffing box repack
  - VFD fault
  - belt/sheave change
  - gearbox oil change
  - counterbalance adjustment
- name: request
  type: str
- name: job_steps
  type: list[str]
  min_items: 2
- name: rig_hours
  type: float
  min: 0
  max: 200
- name: materials
  type: list[str]
- name: cost_inr
  type: float
  min: 0
- name: outcome
  type: str
