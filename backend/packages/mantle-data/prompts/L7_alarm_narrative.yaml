id: L7
name: alarm_narrative
suggested_n: 20000
records_per_call: 1
est_output_tokens: 260
sampled_from:
- S1
variables:
- alarm_code
- well_id
- ts
- snapshot
user_template: 'Explain alarm {alarm_code} raised on {well_id} at {ts} with context {snapshot} in the voice of a
  production engineer''s triage note: probable cause, what to check, urgency (low/med/high).'
fields:
- name: alarm_code
  type: str
- name: well_id
  type: str
- name: timestamp
  type: str
- name: probable_cause
  type: str
- name: checks
  type: list[str]
  min_items: 1
- name: urgency
  type: str
  enum:
  - low
  - med
  - high
